name: Variable Implementation
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Today Date and Time
        run: date
      - name: Server Uptime
        run: uptime  

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test jobs
        run: echo "Hello! This is Test Job"
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: we are going to deploy
        run: echo "Hello! ${{ vars.OS_NAME }}"
      - name: our application name
        run: echo "Our application name is: ${{ vars.APP_NAME }}"
        
